name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: starter
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U starter -d starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: core.settings.dev
      DATABASE_URL: postgresql://starter:ci-only-password@127.0.0.1:5432/starter

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and apply migrations
        run: |
          python manage.py makemigrations --noinput
          python manage.py migrate --noinput
          python manage.py setup_profiles --database=default

      - name: Run tests
        run: python -m pytest -q

      - name: Check Django and OpenAPI
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py spectacular --validate --fail-on-warn --file schema.yml
